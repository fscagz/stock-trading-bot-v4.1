[pytest]
# Test discovery
testpaths = testing
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Exclude legacy/incomplete tests from v1
addopts =
    --ignore=testing/test_alpaca_data.py
    --ignore=testing/test_backtester.py
    --ignore=testing/test_broker.py
    --ignore=testing/test_broker\ copy.py
    --ignore=testing/test_fundamental_store.py
    --ignore=testing/test_indicators.py
    --ignore=testing/test_ml_models.py
    --ignore=testing/test_portfolio.py
    --ignore=testing/test_signal_gen.py
    --ignore=testing/test_store.py
    --ignore=testing/test_yfinance_data.py

# Logging
log_cli = false
log_cli_level = INFO
